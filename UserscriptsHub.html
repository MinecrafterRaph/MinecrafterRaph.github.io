<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MinecrafterRaph Userscripts</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="userscripts-frame"
    src="about:blank"
    title="MinecrafterRaph Userscripts"
    allow="clipboard-write; clipboard-read; fullscreen">
  </iframe>

  <script>
    (function() {
      const BASE_URL = "https://minecrafterraph-userscripts-hub.ai.studio";
      const iframe = document.getElementById("userscripts-frame");

      function updateIframeSrc() {
        const path = window.location.pathname.toLowerCase();
        const hash = window.location.hash.toLowerCase();
        const search = window.location.search.toLowerCase();

        // Prüft, ob /dash in der URL, im Hash (#dash) oder als Parameter (?dash) steht
        const isDash = path.endsWith("/dash") || 
                       path.includes("/dash") || 
                       hash === "#dash" || 
                       hash === "#/dash" || 
                       search.includes("dash");

        const targetSrc = isDash ? (BASE_URL + "/dash") : BASE_URL;

        if (iframe.src !== targetSrc) {
          iframe.src = targetSrc;
        }
      }

      // Initiales Laden
      updateIframeSrc();

      // Erkennt Änderungen, falls ohne Neuladen gewechselt wird (z. B. über #dash)
      window.addEventListener("hashchange", updateIframeSrc);
      window.addEventListener("popstate", updateIframeSrc);
    })();
  </script>

</body>
</html>
