<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MinecrafterRaph — GitHub Projects</title>
  <meta name="description" content="Kuratierte Sammlung aller GitHub Projekte & Web-Apps von MinecrafterRaph" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #faf9f5;
    }
    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
    }
  </style>
</head>
<body>
  <iframe
    id="app-frame"
    title="MinecrafterRaph GitHub Projects"
    allow="clipboard-read; clipboard-write; fullscreen;"
  ></iframe>
  <script>
    (function () {
      var frame = document.getElementById('app-frame');
      var baseUrl = 'https://minecrafterraph-projects.ai.studio/';
      function syncRoute() {
        var target = baseUrl + (window.location.search || '') + (window.location.hash || '');
        if (frame.src !== target) {
          frame.src = target;
        }
      }
      syncRoute();
      window.addEventListener('hashchange', syncRoute);
    })();
  </script>
  <noscript>
    <iframe
      src="https://minecrafterraph-projects.ai.studio/"
      title="MinecrafterRaph GitHub Projects"
    ></iframe>
  </noscript>
</body>
</html>
