<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Landscape Launcher</title>
    <meta
      name="description"
      content="Öffne Webseiten im um 90° gedrehten Smartphone-Querformat als Vollbild."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main id="launcher-view" class="launcher-page">
      <div class="launcher-container">
        <h1 class="launcher-title">Landscape Launcher</h1>
        <p class="launcher-subtitle">
          Webseite eingeben und per Launch im gedrehten Smartphone-Querformat als Vollbild starten.
        </p>

        <form id="launch-form" class="launch-form" novalidate>
          <div class="input-bar">
            <div class="input-wrap">
              <svg
                class="globe-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
              </svg>
              <input
                id="url-input"
                type="url"
                inputmode="url"
                autocomplete="url"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
                autofocus
                placeholder="https://beispiel.de"
                aria-label="Webseiten-URL"
              />
            </div>

            <button id="launch-button" type="submit" class="launch-btn">
              <span>Launch</span>
              <svg
                class="arrow-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </button>
          </div>

          <div id="error-box" class="error-box" role="alert" hidden>
            <svg
              class="error-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="error-text"></span>
          </div>
        </form>
      </div>
    </main>

    <div id="stage-view" class="stage-view" hidden>
      <div class="stage-controls">
        <button id="exit-btn" type="button" class="stage-btn stage-btn-danger" title="Beenden (Esc)">
          <svg
            class="ctrl-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
          <span>Beenden</span>
        </button>

        <button id="reload-btn" type="button" class="stage-btn stage-btn-icon" aria-label="Neu laden" title="Neu laden">
          <svg
            class="ctrl-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
        </button>
      </div>

      <div id="stage-loader" class="stage-loader" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Webseite wird geladen …</span>
      </div>

      <iframe
        id="landscape-frame"
        title="Webseite im gedrehten Querformat (Oben rechts)"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-presentation allow-storage-access-by-user-activation"
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </body>
</html>
