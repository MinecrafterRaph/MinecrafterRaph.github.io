<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig: Verhindert fehlerhaftes Zoomen auf Handys und Tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dein gewünschter Projekttitel im Browser-Tab -->
    <title>WhatsNew</title>
    <style>
        /* Entfernt alle Standard-Ränder des Webbrowsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Verhindert ungewollte doppelte Scrollbalken */
        }

        /* Spannt das iFrame zu 100% über den exakt sichtbaren Bildschirm */
        .fullscreen-iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <!-- Lädt deine exakte Domain im echten Vollbildmodus -->
    <iframe 
        src="https://my-whatsapp.ai.studio" 
        class="fullscreen-iframe"
        allow="microphone; camera; clipboard-write; geolocation">
    </iframe>

</body>
</html>
