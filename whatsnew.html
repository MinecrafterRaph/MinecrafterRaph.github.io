<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsNew</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0b141a;
        }
        .fullscreen-iframe {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1;
        }
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b141a; display: flex; justify-content: center; align-items: center;
            z-index: 99999; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #222e35;
            border-top: 5px solid #00a884; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Grauer Schleier über der Webseite, der Interaktionen mit dem iFrame sperrt */
        #modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 10000;
        }

        #settings-modal {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 300px; max-height: 420px;
            background-color: #111b21; border: 1px solid #222e35; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 10001; color: #e9edef; padding: 15px;
            box-sizing: border-box; animation: fadeIn 0.3s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }
        
        .modal-scroll-area { max-height: 280px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
        .modal-scroll-area::-webkit-scrollbar { width: 6px; }
        .modal-scroll-area::-webkit-scrollbar-thumb { background-color: #374248; border-radius: 3px; }
        
        .modal-title { margin: 0 0 15px 0; font-size: 16px; font-weight: 600; border-bottom: 1px solid #222e35; padding-bottom: 8px; color: #00a884; }
        .permission-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .permission-label { font-size: 14px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374248; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #f0f2f5; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #00a884; }
        input:checked + .slider:before { transform: translateX(18px); }

        .apply-btn {
            width: 100%; background-color: #00a884; color: #ffffff; border: none;
            padding: 10px; font-size: 14px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: background-color 0.2s;
        }
        .apply-btn:hover { background-color: #008f6f; }
    </style>
</head>
<body>

    <div id="loader-overlay"><div class="spinner"></div></div>
    <div id="modal-backdrop"></div>

    <div id="settings-modal">
        <div class="modal-scroll-area">
            <h3 class="modal-title">Berechtigungen</h3>
            <div class="permission-row"><span class="permission-label">Standort</span><label class="switch"><input type="checkbox" id="geo" checked><span class="slider"></span></label></div>
            <div class="permission-row"><span class="permission-label">Mikrofon</span><label class="switch"><input type="checkbox" id="mic" checked><span class="slider"></span></label></div>
            <div class="permission-row"><span class="permission-label">Kamera</span><label class="switch"><input type="checkbox" id="cam" checked><span class="slider"></span></label></div>
            <div class="permission-row"><span class="permission-label">Zwischenablage (Einfügen)</span><label class="switch"><input type="checkbox" id="clip-w" checked><span class="slider"></span></label></div>
            <div class="permission-row"><span class="permission-label">Zwischenablage (Hinzufügen)</span><label class="switch"><input type="checkbox" id="clip-r" checked><span class="slider"></span></label></div>
            <div class="permission-row"><span class="permission-label">Autoplay (Audio/Video)</span><label class="switch"><input type="checkbox" id="auto" checked><span class="slider"></span></label></div>
            <div class="permission-row"><span class="permission-label">Bewegungssensoren (Gyro)</span><label class="switch"><input type="checkbox" id="gyro" checked><span class="slider"></span></label></div>
            <div class="permission-row"><span class="permission-label">Bildunterstützung (Bild in Bild)</span><label class="switch"><input type="checkbox" id="pip" checked><span class="slider"></span></label></div>
        </div>
        <button class="apply-btn" onclick="applySettings()">Apply</button>
    </div>

    <!-- Das iFrame bekommt seine Adresse dynamisch über das JavaScript unten zugewiesen -->
    <iframe id="studio-iframe" class="fullscreen-iframe" allow="geolocation; microphone; camera; clipboard-write; clipboard-read; autoplay; fullscreen; accelerometer; gyroscope; magnetometer; picture-in-picture" allowfullscreen></iframe>

    <script>
        // ==========================================================
        // EINSTELLUNGEN & VARIABLEN
        // ==========================================================
        const WEBSITE_URL = "https://my-whatsapp.ai.studio"; // Meine Studio-Adresse
        const ZEIGE_BERECHTIGUNGS_FENSTER = 1;              // Fenster 1/0 = an/aus

        let wurdeBestaetigt = false;

        const iframe = document.getElementById('studio-iframe');
        const loader = document.getElementById('loader-overlay');
        const modal = document.getElementById('settings-modal');
        const backdrop = document.getElementById('modal-backdrop');

        // ==========================================================
        // KANAL-EINLADUNG AUS URL ERKENNEN
        // Unterstützt:
        // - https://minecrafterraph.github.io/whatsnew.html/channel/[channelId]
        // - https://minecrafterraph.github.io/whatsnew.html?channel=[channelId]
        // - https://minecrafterraph.github.io/whatsnew.html#channel=[channelId]
        // ==========================================================
        function getInviteChannelId() {
            try {
                // 1. Prüfe URL-Pfad
                const pathMatch = window.location.pathname.match(/\/channel\/([a-zA-Z0-9_\-]+)/i);
                if (pathMatch && pathMatch[1]) return pathMatch[1];

                // 2. Prüfe Query-Parameter
                const params = new URLSearchParams(window.location.search);
                const channelParam = params.get('channel') || params.get('channelId') || params.get('invite');
                if (channelParam && channelParam.trim()) return channelParam.trim();

                // 3. Prüfe Hash
                const hashMatch = (window.location.hash || '').match(/(?:channel|invite)[=\/]([a-zA-Z0-9_\-]+)/i);
                if (hashMatch && hashMatch[1]) return hashMatch[1];
            } catch (e) {
                console.error("Fehler beim Lesen der Kanal-ID:", e);
            }
            return null;
        }

        // URL des iFrames mit eventueller Kanal-ID zusammenbauen
        const inviteChannelId = getInviteChannelId();
        let targetIframeUrl = WEBSITE_URL;
        if (inviteChannelId) {
            const separator = targetIframeUrl.includes('?') ? '&' : '?';
            targetIframeUrl += separator + 'channel=' + encodeURIComponent(inviteChannelId);
        }

        // Setzt die URL beim ersten Laden der Seite aktiv in das iFrame ein
        iframe.src = targetIframeUrl;

        iframe.addEventListener('load', function() {
            loader.style.opacity = '0';
            setTimeout(() => { 
                loader.style.display = 'none'; 
                
                // Verhindert das erneute Laden des Fenster nach dem Apply-Reload
                if (ZEIGE_BERECHTIGUNGS_FENSTER === 1 && wurdeBestaetigt === false) {
                    modal.style.display = 'block';
                    backdrop.style.display = 'block';
                }

                // Falls eine Kanal-ID in der URL war, zusätzlich per postMessage an den iFrame senden
                if (inviteChannelId && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({
                        type: 'CHANNEL_INVITE',
                        channelId: inviteChannelId
                    }, '*');
                }
            }, 500);
        });

        function applySettings() {
            wurdeBestaetigt = true;

            let allowFeatures = [];
            if (document.getElementById('geo').checked) allowFeatures.push('geolocation');
            if (document.getElementById('mic').checked) allowFeatures.push('microphone');
            if (document.getElementById('cam').checked) allowFeatures.push('camera');
            if (document.getElementById('clip-w').checked) allowFeatures.push('clipboard-write');
            if (document.getElementById('clip-r').checked) allowFeatures.push('clipboard-read');
            if (document.getElementById('auto').checked) allowFeatures.push('autoplay');
            if (document.getElementById('gyro').checked) allowFeatures.push('accelerometer', 'gyroscope', 'magnetometer');
            if (document.getElementById('pip').checked) allowFeatures.push('picture-in-picture');
            allowFeatures.push('fullscreen');

            modal.style.display = 'none';
            backdrop.style.display = 'none';

            loader.style.display = 'flex';
            loader.style.opacity = '1';

            iframe.setAttribute('allow', allowFeatures.join('; '));
            iframe.src = iframe.src; 
        }

        window.addEventListener('click', function(e) {
            if (e.target !== modal && !modal.contains(e.target)) {
                modal.style.display = 'none';
            }
        });

        // ==========================================================
        // SPEICHER- & EINLADUNGS-BRÜCKE (postMessage)
        // ==========================================================
        window.addEventListener('message', function(event) {
            // Sicherheitsprüfung: Prüfe, ob die Nachricht von deiner App stammt
            // (Erlaubt die konfigurierte WEBSITE_URL sowie eventuelle Subdomains)
            const allowedOrigin = new URL(WEBSITE_URL).origin;
            if (event.origin !== allowedOrigin && event.origin !== "null" && !event.origin.includes(".run.app") && !event.origin.includes(".ai.studio")) {
                return;
            }

            const iframeWindow = iframe.contentWindow;
            if (!iframeWindow) return;
            const data = event.data;

            if (data && data.type) {
                switch (data.type) {
                    // 1. Lokale Speicherverwaltung
                    case 'LOCAL_STORAGE_SET':
                        localStorage.setItem(data.key, data.value);
                        break;

                    case 'LOCAL_STORAGE_GET':
                        const gespeicherterWert = localStorage.getItem(data.key);
                        iframeWindow.postMessage({
                            type: 'LOCAL_STORAGE_RESPONSE',
                            key: data.key,
                            value: gespeicherterWert
                        }, '*');
                        break;

                    case 'LOCAL_STORAGE_REMOVE':
                        localStorage.removeItem(data.key);
                        break;

                    // 2. Kanal-Einladungs-Abfrage von WhatsNew
                    case 'GET_INVITE_CHANNEL':
                    case 'GET_CHANNEL_INVITE': {
                        const currentChannelId = getInviteChannelId();
                        if (currentChannelId) {
                            iframeWindow.postMessage({
                                type: 'CHANNEL_INVITE_RESPONSE',
                                channelId: currentChannelId
                            }, '*');
                        }
                        break;
                    }
                }
            }
        });
    </script>
</body>
</html>
