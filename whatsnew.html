<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Verhindert, dass das Smartphone die skalierten Inhalte eigenmächtig verzieht -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Desktop-Ansicht</title>
    <style>
        /* Verhindert Ränder und Scrollbalken auf der Hauptseite */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Hintergrundfarbe für eventuelle Lade-Ränder */
        }

        /* Der virtuelle Desktop-Container */
        .desktop-scaler {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;        /* Zwingt die Seite in das Standard-Desktop-Layout */
            height: 100%;
            transform-origin: top left;
            
            /* Berechnet die Skalierung: Teilt die echte Displaybreite durch 1280px */
            transform: scale(calc(100vw / 1280)); 
        }

        /* Das Iframe, das deine Webseite lädt */
        .desktop-scaler iframe {
            width: 100%;
            /* Berechnet die virtuelle Höhe, da das Iframe gestaucht wird */
            height: calc(100vh * (1280 / 100vw)); 
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="desktop-scaler">
        <!-- Deine Webseite im skalierten Desktop-Modus inklusive Kamera- & Mikrofon-Freigabe -->
        <iframe 
            src="https://my-whatsapp.ai.studio" 
            title="WhatsNew Web"
            allow="camera; microphone; display-capture; geolocation">
        </iframe>
    </div>

</body>
</html>
